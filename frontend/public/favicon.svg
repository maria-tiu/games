<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" aria-labelledby="games-favicon-title">
  <title id="games-favicon-title">Games</title>
  <!-- Controller body -->
  <rect x="4" y="14" width="40" height="22" rx="11" fill="#00f0f0"/>
  <!-- Left grip -->
  <rect x="4" y="25" width="12" height="11" rx="6" fill="#00f0f0"/>
  <!-- Right grip -->
  <rect x="32" y="25" width="12" height="11" rx="6" fill="#00f0f0"/>
  <!-- D-pad horizontal -->
  <rect x="11" y="22" width="10" height="4" rx="1" fill="#111127"/>
  <!-- D-pad vertical -->
  <rect x="14" y="19" width="4" height="10" rx="1" fill="#111127"/>
  <!-- Action buttons (diamond layout) -->
  <circle cx="35" cy="16" r="2.5" fill="#ffd93d"/>
  <circle cx="32" cy="21" r="2.5" fill="#ff6b6b"/>
  <circle cx="38" cy="21" r="2.5" fill="#4f9eff"/>
  <circle cx="35" cy="26" r="2.5" fill="#6bcb77"/>
  <!-- Center select/start buttons -->
  <rect x="20" y="23" width="3.5" height="2.5" rx="1" fill="#111127"/>
  <rect x="24.5" y="23" width="3.5" height="2.5" rx="1" fill="#111127"/>
</svg>